<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookmarks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ═══════════════════════════════════════════════════════════════
       BASE & TOKENS
    ═══════════════════════════════════════════════════════════════ */
    :root {
      --bg:            #0d1117;
      --bg-2:          #111827;
      --bg-image:      url("images/image_low.jpg");
      --surface:       rgba(255,255,255,0.04);
      --surface-hover: rgba(255,255,255,0.08);
      --border:        rgba(255,255,255,0.07);
      --border-hover:  rgba(255,255,255,0.16);

      --accent:        #6366f1;
      --accent-2:      #8b5cf6;
      --accent-glow:   rgba(99,102,241,0.25);

      --text-1:  #e2e8f0;
      --text-2:  #94a3b8;
      --text-3:  #64748b;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;

      --shadow-card: 0 4px 24px rgba(0,0,0,0.4);
      --shadow-glow: 0 0 0 1px var(--accent-glow), 0 8px 32px rgba(99,102,241,0.18);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      background:
        linear-gradient(rgba(13,17,23,0.74), rgba(13,17,23,0.86)),
        var(--bg-image) center / cover fixed no-repeat,
        var(--bg);
      color: var(--text-1);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ═══════════════════════════════════════════════════════════════
       ANIMATED BACKGROUND GRADIENT
    ═══════════════════════════════════════════════════════════════ */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        linear-gradient(rgba(13,17,23,0.18), rgba(13,17,23,0.42)),
        radial-gradient(ellipse 80% 50% at 20% 10%, rgba(99,102,241,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(139,92,246,0.06) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* ═══════════════════════════════════════════════════════════════
       HEADER
    ═══════════════════════════════════════════════════════════════ */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(13,17,23,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 28px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .logo {
      font-size: 18px;
      font-weight: 700;
      background: linear-gradient(135deg, #a5b4fc, #c4b5fd, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      font-size: 20px;
      -webkit-text-fill-color: initial;
    }

    .header-meta {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 11px;
      color: var(--text-2);
      font-weight: 500;
    }

    /* ═══════════════════════════════════════════════════════════════
       MAIN LAYOUT
    ═══════════════════════════════════════════════════════════════ */
    .main {
      position: relative;
      z-index: 1;
      max-width: 1400px;
      margin: 0 auto;
      padding: 28px 28px 60px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* ═══════════════════════════════════════════════════════════════
       SKELETON LOADER
    ═══════════════════════════════════════════════════════════════ */
    @keyframes shimmer {
      0%   { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }

    .skeleton {
      background: linear-gradient(90deg,
        var(--surface) 25%,
        rgba(255,255,255,0.07) 50%,
        var(--surface) 75%
      );
      background-size: 800px 100%;
      animation: shimmer 1.4s infinite;
      border-radius: var(--radius-sm);
    }

    /* ═══════════════════════════════════════════════════════════════
       CATEGORY SECTION
    ═══════════════════════════════════════════════════════════════ */
    .category {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .category:hover {
      border-color: var(--border-hover);
    }

    /* ── Category header (collapsible trigger) ── */
    .category-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      cursor: pointer;
      user-select: none;
      gap: 10px;
      background: rgba(255,255,255,0.02);
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }

    .category-header:hover { background: rgba(255,255,255,0.04); }

    .category-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .category-icon {
      width: 28px;
      height: 28px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
    }

    .category-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-1);
      letter-spacing: -0.1px;
    }

    .category-count {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-3);
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1px 8px;
    }

    .category-chevron {
      color: var(--text-3);
      font-size: 11px;
      transition: transform 0.2s ease;
      margin-left: auto;
    }

    .category.collapsed .category-chevron {
      transform: rotate(-90deg);
    }

    /* ── Category body ── */
    .category-body {
      padding: 16px;
      overflow: hidden;
      transition: max-height 0.3s ease, opacity 0.2s ease, padding 0.2s ease;
    }

    .category.collapsed .category-body {
      max-height: 0 !important;
      padding-top: 0;
      padding-bottom: 0;
      opacity: 0;
      pointer-events: none;
    }

    /* ═══════════════════════════════════════════════════════════════
       BOOKMARK GRID
    ═══════════════════════════════════════════════════════════════ */
    .bookmarks-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
    }

    /* ═══════════════════════════════════════════════════════════════
       BOOKMARK CARD
    ═══════════════════════════════════════════════════════════════ */
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .bookmark-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      text-decoration: none;
      color: var(--text-1);
      transition:
        background 0.15s,
        border-color 0.15s,
        transform 0.15s,
        box-shadow 0.15s;
      animation: cardIn 0.25s ease both;
      overflow: hidden;
      min-width: 0;
    }

    .bookmark-card:hover {
      background: var(--surface-hover);
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: var(--shadow-glow);
    }

    .favicon-wrap {
      width: 28px;
      height: 28px;
      border-radius: var(--radius-sm);
      background: rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }

    .favicon {
      width: 16px;
      height: 16px;
      object-fit: contain;
      border-radius: 2px;
    }

    .favicon-fallback {
      font-size: 13px;
      line-height: 1;
    }

    .bookmark-title {
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-1);
      flex: 1;
      min-width: 0;
    }

    /* ═══════════════════════════════════════════════════════════════
       NESTED FOLDER (sub-category inside a category)
    ═══════════════════════════════════════════════════════════════ */
    .subcategory {
      margin-top: 14px;
    }

    .subcategory-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .subcategory-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-2);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .subcategory-count {
      font-size: 10px;
      color: var(--text-3);
    }

    /* ═══════════════════════════════════════════════════════════════
       EMPTY STATE
    ═══════════════════════════════════════════════════════════════ */
    .empty-state {
      text-align: center;
      padding: 64px 24px;
      color: var(--text-3);
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
      display: block;
    }

    .empty-state h2 {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-2);
      margin-bottom: 8px;
    }

    .empty-state p {
      font-size: 13px;
    }

    /* ═══════════════════════════════════════════════════════════════
       SCROLLBAR
    ═══════════════════════════════════════════════════════════════ */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

    /* ═══════════════════════════════════════════════════════════════
       SEARCH BAR
    ═══════════════════════════════════════════════════════════════ */
    .search-wrap {
      flex: 1;
      max-width: 520px;
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      font-size: 13px;
      color: var(--text-3);
      pointer-events: none;
      line-height: 1;
    }

    .search-input {
      width: 100%;
      height: 36px;
      padding: 0 72px 0 36px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-1);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
    }

    .search-input::placeholder { color: var(--text-3); }

    .search-input:focus {
      border-color: var(--accent);
      background: rgba(99,102,241,0.07);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.18);
    }

    /* Hide browser-native clear button */
    .search-input::-webkit-search-cancel-button { display: none; }

    .search-kbd {
      position: absolute;
      right: 10px;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 2px 6px;
      font-size: 10px;
      font-family: 'Inter', sans-serif;
      color: var(--text-3);
      pointer-events: none;
      letter-spacing: 0.3px;
      transition: opacity 0.15s;
    }

    .search-input:focus ~ .search-kbd { opacity: 0; }

    /* ═══════════════════════════════════════════════════════════════
       SEARCH PANEL
    ═══════════════════════════════════════════════════════════════ */
    .search-panel {
      position: relative;
      z-index: 1;
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px 28px 60px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .search-panel.hidden { display: none; }

    .search-summary {
      font-size: 12px;
      color: var(--text-3);
      font-weight: 500;
    }

    .search-summary strong {
      color: var(--text-2);
      font-weight: 600;
    }

    /* Search result card — same as bookmark-card but with a path row */
    .search-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      text-decoration: none;
      color: var(--text-1);
      transition: background 0.15s, border-color 0.15s, transform 0.15s, box-shadow 0.15s;
      animation: cardIn 0.2s ease both;
      overflow: hidden;
      min-width: 0;
    }

    .search-card:hover {
      background: var(--surface-hover);
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: var(--shadow-glow);
    }

    .search-card-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
      min-width: 0;
    }

    .search-card-title {
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-1);
    }

    .search-card-path {
      font-size: 10px;
      color: var(--text-3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Highlight matched text */
    mark.hl {
      background: rgba(99,102,241,0.35);
      color: #c7d2fe;
      border-radius: 3px;
      padding: 0 1px;
      font-style: normal;
    }

    /* No results */
    .no-results {
      text-align: center;
      padding: 60px 24px;
      color: var(--text-3);
    }

    .no-results.hidden { display: none; }

    .no-results-icon {
      font-size: 40px;
      margin-bottom: 14px;
      display: block;
    }

    .no-results h3 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-2);
      margin-bottom: 6px;
    }

    .no-results p { font-size: 12px; }

    /* ═══════════════════════════════════════════════════════════════
       LIGHT THEME  (toggled via <html data-theme="light">)
    ═══════════════════════════════════════════════════════════════ */
    [data-theme="light"] {
      --bg:            #f1f5f9;
      --bg-2:          #e8edf4;
      --surface:       rgba(0,0,0,0.04);
      --surface-hover: rgba(0,0,0,0.07);
      --border:        rgba(0,0,0,0.09);
      --border-hover:  rgba(0,0,0,0.18);
      --text-1:        #0f172a;
      --text-2:        #475569;
      --text-3:        #94a3b8;
      --shadow-glow:   0 0 0 1px rgba(99,102,241,0.3), 0 8px 24px rgba(99,102,241,0.12);
    }

    [data-theme="light"] body { background: var(--bg); }

    [data-theme="light"] body::before {
      background:
        radial-gradient(ellipse 80% 50% at 20% 10%, rgba(99,102,241,0.05) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(139,92,246,0.04) 0%, transparent 60%);
    }

    [data-theme="light"] .header {
      background: rgba(241,245,249,0.88);
    }

    [data-theme="light"] .category-header {
      background: rgba(0,0,0,0.02);
    }

    [data-theme="light"] .category-header:hover {
      background: rgba(0,0,0,0.04);
    }

    [data-theme="light"] .settings-drawer {
      background: #f8fafc;
    }

    [data-theme="light"] .favicon-wrap {
      background: rgba(0,0,0,0.06);
    }

    /* ═══════════════════════════════════════════════════════════════
       VIEW MODES
    ═══════════════════════════════════════════════════════════════ */

    /* ── List view ── */
    body.view-list .bookmarks-grid {
      grid-template-columns: 1fr !important;
    }

    body.view-list .bookmark-card,
    body.view-list .search-card {
      padding: 9px 14px;
    }

    /* ── Card sizes ── */
    body.card-sm .bookmarks-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
    body.card-md .bookmarks-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
    body.card-lg .bookmarks-grid { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }

    /* ═══════════════════════════════════════════════════════════════
       SETTINGS BUTTON (header)
    ═══════════════════════════════════════════════════════════════ */
    .settings-btn {
      width: 34px;
      height: 34px;
      border-radius: var(--radius-sm);
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-2);
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.25s;
    }

    .settings-btn:hover {
      background: var(--surface-hover);
      border-color: var(--border-hover);
      color: var(--text-1);
      transform: rotate(45deg);
    }

    .settings-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      transform: rotate(90deg);
    }

    /* ═══════════════════════════════════════════════════════════════
       SETTINGS OVERLAY
    ═══════════════════════════════════════════════════════════════ */
    .settings-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }

    .settings-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    /* ═══════════════════════════════════════════════════════════════
       SETTINGS DRAWER
    ═══════════════════════════════════════════════════════════════ */
    .settings-drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 300px;
      background: #131929;
      border-left: 1px solid var(--border);
      z-index: 201;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }

    .settings-drawer.open {
      transform: translateX(0);
    }

    /* ── Drawer header ── */
    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .drawer-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-1);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .drawer-close {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: transparent;
      border: none;
      color: var(--text-3);
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
    }

    .drawer-close:hover {
      background: var(--surface-hover);
      color: var(--text-1);
    }

    /* ── Drawer body (scrollable) ── */
    .drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* ── Settings section ── */
    .settings-section-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 10px;
    }

    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .settings-row:last-child { margin-bottom: 0; }

    .settings-row-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-2);
      flex-shrink: 0;
    }

    /* ── Button group (option pills) ── */
    .btn-group {
      display: flex;
      gap: 4px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 3px;
    }

    .btn-opt {
      padding: 4px 10px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--text-3);
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }

    .btn-opt:hover {
      background: rgba(255,255,255,0.07);
      color: var(--text-1);
    }

    .btn-opt.active {
      background: var(--accent);
      color: #fff;
    }

    /* ── Category toggle rows ── */
    .cat-toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 0;
      border-bottom: 1px solid var(--border);
    }

    .cat-toggle-row:last-child { border-bottom: none; }

    .cat-toggle-name {
      font-size: 12px;
      color: var(--text-2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Toggle switch ── */
    .toggle {
      position: relative;
      width: 34px;
      height: 20px;
      flex-shrink: 0;
    }

    .toggle input { opacity: 0; width: 0; height: 0; }

    .toggle-track {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.1);
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .toggle input:checked + .toggle-track {
      background: var(--accent);
    }

    .toggle-track::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 14px;
      height: 14px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .toggle input:checked + .toggle-track::after {
      transform: translateX(14px);
    }

    /* ── Divider ── */
    .drawer-divider {
      height: 1px;
      background: var(--border);
    }

    /* ═══════════════════════════════════════════════════════════════
       CATEGORY — hidden state
    ═══════════════════════════════════════════════════════════════ */
    .category.cat-hidden {
      display: none;
    }

    /* ═══════════════════════════════════════════════════════════════
       RESPONSIVE
    ═══════════════════════════════════════════════════════════════ */
    @media (max-width: 700px) {
      .header-inner { padding: 0 16px; gap: 10px; }
      .main, .search-panel { padding: 16px 16px 48px; }
      .bookmarks-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
      .search-kbd { display: none; }
      .settings-drawer { width: 100%; }
    }

    @media (max-width: 420px) {
      .bookmarks-grid { grid-template-columns: 1fr 1fr; }
    }

    /* ═══════════════════════════════════════════════════════════════
       PHASE 6 — DRAG & DROP
    ═══════════════════════════════════════════════════════════════ */
    .drag-handle {
      color: var(--text-3); font-size: 13px; padding: 0 4px 0 0;
      cursor: grab; opacity: 0; transition: opacity 0.15s; flex-shrink: 0;
      user-select: none;
    }
    .category-header:hover .drag-handle { opacity: 1; }
    .category.dragging {
      opacity: 0.45; border-style: dashed;
    }
    .category.drag-over {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }
    /* Bookmark card drag */
    .bookmark-card.card-dragging { opacity: 0.4; border-style: dashed; cursor: grabbing; }
    .bookmark-card.card-drag-over { border-color: var(--accent); box-shadow: var(--shadow-glow); }

    /* ═══════════════════════════════════════════════════════════════
       PHASE 6 — FLOATING ACTION BUTTON
    ═══════════════════════════════════════════════════════════════ */
    .fab-wrap {
      position: fixed; bottom: 28px; right: 28px;
      z-index: 150;
      display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
    }
    .fab-main {
      width: 48px; height: 48px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border: none; color: #fff; font-size: 22px; font-weight: 300;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 20px rgba(99,102,241,0.45);
      transition: transform 0.25s, box-shadow 0.25s;
    }
    .fab-main:hover { transform: scale(1.08); box-shadow: 0 6px 28px rgba(99,102,241,0.55); }
    .fab-main.open  { transform: rotate(45deg); }
    .fab-actions {
      display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
      max-height: 0; overflow: hidden; opacity: 0; pointer-events: none;
      transition: max-height 0.3s ease, opacity 0.2s;
    }
    .fab-actions.open { max-height: 260px; opacity: 1; pointer-events: all; }
    .fab-row {
      display: flex; align-items: center; gap: 10px;
      animation: fabIn 0.2s ease both;
    }
    @keyframes fabIn {
      from { opacity:0; transform: translateY(8px); }
      to   { opacity:1; transform: translateY(0); }
    }
    .fab-label {
      font-size: 11px; font-weight: 600; color: var(--text-2);
      background: rgba(13,17,23,0.92); border: 1px solid var(--border);
      border-radius: 6px; padding: 4px 10px; white-space: nowrap;
      backdrop-filter: blur(8px);
    }
    [data-theme="light"] .fab-label { background: rgba(248,250,252,0.92); }
    .fab-btn {
      width: 38px; height: 38px; border-radius: 50%;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text-1); font-size: 15px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, transform 0.15s;
    }
    .fab-btn:hover { background: var(--surface-hover); transform: scale(1.1); }
  </style>
</head>
<body>

  <!-- ── HEADER ─────────────────────────────────────────── -->
  <header class="header" role="banner">
    <div class="header-inner">
      <h1 class="logo">
        <span class="logo-icon">⚡</span>
        Bookmarks
      </h1>

      <!-- ── Search bar ── -->
      <div class="search-wrap" role="search">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input
          type="search"
          id="search-input"
          class="search-input"
          placeholder="Search bookmarks…"
          autocomplete="off"
          spellcheck="false"
          aria-label="Search bookmarks"
        />
        <kbd class="search-kbd" aria-hidden="true">Ctrl K</kbd>
      </div>

      <div class="header-meta">
        <span class="badge" id="total-badge">Loading…</span>
      </div>
    </div>
  </header>


  <!-- ── SEARCH RESULTS PANEL (shown when typing) ─────── -->
  <div class="search-panel hidden" id="search-panel" role="region" aria-label="Search results" aria-live="polite">
    <p class="search-summary" id="search-summary"></p>
    <div class="bookmarks-grid" id="search-grid"></div>
    <div class="no-results hidden" id="no-results">
      <span class="no-results-icon">🔍</span>
      <h3>No results found</h3>
      <p>Try a different title or URL.</p>
    </div>
  </div>

  <!-- ── MAIN CATEGORIES ───────────────────────────────── -->
  <main class="main" id="main" role="main">
    <!-- Rendered by newtab.js -->
  </main>

  <!-- ── FLOATING ACTION BUTTON ────────────────────── -->
  <div class="fab-wrap" id="fab-wrap">
    <div class="fab-actions" id="fab-actions">
      <div class="fab-row" style="animation-delay:.05s">
        <span class="fab-label">Scroll to Top</span>
        <button class="fab-btn" id="fab-top" title="Scroll to top">⬆️</button>
      </div>
      <div class="fab-row" style="animation-delay:.10s">
        <span class="fab-label">Settings</span>
        <button class="fab-btn" id="fab-settings" title="Settings">⚙️</button>
      </div>
      <div class="fab-row" style="animation-delay:.15s">
        <span class="fab-label">Refresh Bookmarks</span>
        <button class="fab-btn" id="fab-refresh" title="Refresh bookmarks">🔄</button>
      </div>
    </div>
    <button class="fab-main" id="fab-main" aria-label="Quick actions" aria-expanded="false">+</button>
  </div>

  <!-- ── SETTINGS OVERLAY ──────────────────────────────── -->
  <div class="settings-overlay" id="settings-overlay" aria-hidden="true"></div>

  <!-- ── SETTINGS DRAWER ───────────────────────────────── -->
  <aside class="settings-drawer" id="settings-drawer" role="dialog" aria-modal="true" aria-label="Settings">
    <div class="drawer-header">
      <span class="drawer-title">⚙️ Settings</span>
      <button class="drawer-close" id="settings-close" aria-label="Close settings">✕</button>
    </div>

    <div class="drawer-body">

      <!-- Appearance -->
      <div>
        <div class="settings-section-label">Appearance</div>
        <div class="settings-row">
          <span class="settings-row-label">Theme</span>
          <div class="btn-group" id="theme-group">
            <button class="btn-opt" data-value="dark"  id="theme-dark">🌙 Dark</button>
            <button class="btn-opt" data-value="light" id="theme-light">☀️ Light</button>
          </div>
        </div>
      </div>

      <div class="drawer-divider"></div>

      <!-- Layout -->
      <div>
        <div class="settings-section-label">Layout</div>
        <div class="settings-row">
          <span class="settings-row-label">View</span>
          <div class="btn-group" id="view-group">
            <button class="btn-opt" data-value="grid" id="view-grid">⊞ Grid</button>
            <button class="btn-opt" data-value="list" id="view-list">≡ List</button>
          </div>
        </div>
        <div class="settings-row">
          <span class="settings-row-label">Card Size</span>
          <div class="btn-group" id="size-group">
            <button class="btn-opt" data-value="sm" id="size-sm">S</button>
            <button class="btn-opt" data-value="md" id="size-md">M</button>
            <button class="btn-opt" data-value="lg" id="size-lg">L</button>
          </div>
        </div>
      </div>

      <div class="drawer-divider"></div>

      <!-- Categories -->
      <div>
        <div class="settings-section-label">Show / Hide Categories</div>
        <div id="category-toggles">
          <p style="font-size:11px;color:var(--text-3)">Loading…</p>
        </div>
      </div>

    </div>
  </aside>

  <script src="newtab.js"></script>
</body>
</html>
