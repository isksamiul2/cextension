<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookmarks</title>
  <style>
    /* ── Reset ─────────────────────────────────────────────── */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: sans-serif;
      font-size: 14px;
      padding: 24px;
      background: #fff;
      color: #111;
      line-height: 1.6;
    }

    h1 {
      font-size: 18px;
      margin-bottom: 16px;
    }

    /* ── Collapsible folder (details / summary) ─────────────── */
    details {
      margin-bottom: 6px;
    }

    summary {
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      padding: 4px 2px;
      list-style: none;          /* hide default triangle in Firefox */
      user-select: none;
    }

    /* Custom triangle via ::before */
    summary::before {
      content: '▶ ';
      font-size: 10px;
      display: inline-block;
      transition: transform 0.15s;
    }

    details[open] > summary::before {
      transform: rotate(90deg);
    }

    /* Remove default marker in Chrome/Safari */
    summary::-webkit-details-marker { display: none; }

    /* ── Bookmark list inside a folder ──────────────────────── */
    .bookmark-list {
      list-style: none;
      padding: 0;
      margin: 2px 0 4px 18px;    /* indent children under the folder */
      border-left: 2px solid #e0e0e0;
      padding-left: 10px;
    }

    .bookmark-list li {
      margin: 3px 0;
    }

    a {
      color: #1a0dab;
      text-decoration: none;
    }

    a:hover { text-decoration: underline; }

    #status {
      color: #999;
      font-style: italic;
    }
  </style>
</head>
<body>
  <h1>📚 Bookmarks</h1>
  <p id="status">Loading bookmarks…</p>
  <div id="bookmark-root"></div>

  <script src="newtab.js"></script>
</body>
</html>
