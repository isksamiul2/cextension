<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookmarks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ═══════════════════════════════════════════════════════════════
       BASE & TOKENS
    ═══════════════════════════════════════════════════════════════ */
    :root {
      --bg:            #0d1117;
      --bg-2:          #111827;
      --surface:       rgba(255,255,255,0.04);
      --surface-hover: rgba(255,255,255,0.08);
      --border:        rgba(255,255,255,0.07);
      --border-hover:  rgba(255,255,255,0.16);

      --accent:        #6366f1;
      --accent-2:      #8b5cf6;
      --accent-glow:   rgba(99,102,241,0.25);

      --text-1:  #e2e8f0;
      --text-2:  #94a3b8;
      --text-3:  #64748b;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;

      --shadow-card: 0 4px 24px rgba(0,0,0,0.4);
      --shadow-glow: 0 0 0 1px var(--accent-glow), 0 8px 32px rgba(99,102,241,0.18);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      background: var(--bg);
      color: var(--text-1);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ═══════════════════════════════════════════════════════════════
       ANIMATED BACKGROUND GRADIENT
    ═══════════════════════════════════════════════════════════════ */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 20% 10%, rgba(99,102,241,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(139,92,246,0.06) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* ═══════════════════════════════════════════════════════════════
       HEADER
    ═══════════════════════════════════════════════════════════════ */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(13,17,23,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 28px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .logo {
      font-size: 18px;
      font-weight: 700;
      background: linear-gradient(135deg, #a5b4fc, #c4b5fd, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      font-size: 20px;
      -webkit-text-fill-color: initial;
    }

    .header-meta {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 11px;
      color: var(--text-2);
      font-weight: 500;
    }

    /* ═══════════════════════════════════════════════════════════════
       MAIN LAYOUT
    ═══════════════════════════════════════════════════════════════ */
    .main {
      position: relative;
      z-index: 1;
      max-width: 1400px;
      margin: 0 auto;
      padding: 28px 28px 60px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* ═══════════════════════════════════════════════════════════════
       SKELETON LOADER
    ═══════════════════════════════════════════════════════════════ */
    @keyframes shimmer {
      0%   { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }

    .skeleton {
      background: linear-gradient(90deg,
        var(--surface) 25%,
        rgba(255,255,255,0.07) 50%,
        var(--surface) 75%
      );
      background-size: 800px 100%;
      animation: shimmer 1.4s infinite;
      border-radius: var(--radius-sm);
    }

    /* ═══════════════════════════════════════════════════════════════
       CATEGORY SECTION
    ═══════════════════════════════════════════════════════════════ */
    .category {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .category:hover {
      border-color: var(--border-hover);
    }

    /* ── Category header (collapsible trigger) ── */
    .category-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      cursor: pointer;
      user-select: none;
      gap: 10px;
      background: rgba(255,255,255,0.02);
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }

    .category-header:hover { background: rgba(255,255,255,0.04); }

    .category-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .category-icon {
      width: 28px;
      height: 28px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
    }

    .category-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-1);
      letter-spacing: -0.1px;
    }

    .category-count {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-3);
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1px 8px;
    }

    .category-chevron {
      color: var(--text-3);
      font-size: 11px;
      transition: transform 0.2s ease;
      margin-left: auto;
    }

    .category.collapsed .category-chevron {
      transform: rotate(-90deg);
    }

    /* ── Category body ── */
    .category-body {
      padding: 16px;
      overflow: hidden;
      transition: max-height 0.3s ease, opacity 0.2s ease, padding 0.2s ease;
    }

    .category.collapsed .category-body {
      max-height: 0 !important;
      padding-top: 0;
      padding-bottom: 0;
      opacity: 0;
      pointer-events: none;
    }

    /* ═══════════════════════════════════════════════════════════════
       BOOKMARK GRID
    ═══════════════════════════════════════════════════════════════ */
    .bookmarks-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
    }

    /* ═══════════════════════════════════════════════════════════════
       BOOKMARK CARD
    ═══════════════════════════════════════════════════════════════ */
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .bookmark-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      text-decoration: none;
      color: var(--text-1);
      transition:
        background 0.15s,
        border-color 0.15s,
        transform 0.15s,
        box-shadow 0.15s;
      animation: cardIn 0.25s ease both;
      overflow: hidden;
      min-width: 0;
    }

    .bookmark-card:hover {
      background: var(--surface-hover);
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: var(--shadow-glow);
    }

    .favicon-wrap {
      width: 28px;
      height: 28px;
      border-radius: var(--radius-sm);
      background: rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }

    .favicon {
      width: 16px;
      height: 16px;
      object-fit: contain;
      border-radius: 2px;
    }

    .favicon-fallback {
      font-size: 13px;
      line-height: 1;
    }

    .bookmark-title {
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-1);
      flex: 1;
      min-width: 0;
    }

    /* ═══════════════════════════════════════════════════════════════
       NESTED FOLDER (sub-category inside a category)
    ═══════════════════════════════════════════════════════════════ */
    .subcategory {
      margin-top: 14px;
    }

    .subcategory-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .subcategory-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-2);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .subcategory-count {
      font-size: 10px;
      color: var(--text-3);
    }

    /* ═══════════════════════════════════════════════════════════════
       EMPTY STATE
    ═══════════════════════════════════════════════════════════════ */
    .empty-state {
      text-align: center;
      padding: 64px 24px;
      color: var(--text-3);
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
      display: block;
    }

    .empty-state h2 {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-2);
      margin-bottom: 8px;
    }

    .empty-state p {
      font-size: 13px;
    }

    /* ═══════════════════════════════════════════════════════════════
       SCROLLBAR
    ═══════════════════════════════════════════════════════════════ */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

    /* ═══════════════════════════════════════════════════════════════
       SEARCH BAR
    ═══════════════════════════════════════════════════════════════ */
    .search-wrap {
      flex: 1;
      max-width: 520px;
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      font-size: 13px;
      color: var(--text-3);
      pointer-events: none;
      line-height: 1;
    }

    .search-input {
      width: 100%;
      height: 36px;
      padding: 0 72px 0 36px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-1);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
    }

    .search-input::placeholder { color: var(--text-3); }

    .search-input:focus {
      border-color: var(--accent);
      background: rgba(99,102,241,0.07);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.18);
    }

    /* Hide browser-native clear button */
    .search-input::-webkit-search-cancel-button { display: none; }

    .search-kbd {
      position: absolute;
      right: 10px;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 2px 6px;
      font-size: 10px;
      font-family: 'Inter', sans-serif;
      color: var(--text-3);
      pointer-events: none;
      letter-spacing: 0.3px;
      transition: opacity 0.15s;
    }

    .search-input:focus ~ .search-kbd { opacity: 0; }

    /* ═══════════════════════════════════════════════════════════════
       SEARCH PANEL
    ═══════════════════════════════════════════════════════════════ */
    .search-panel {
      position: relative;
      z-index: 1;
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px 28px 60px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .search-panel.hidden { display: none; }

    .search-summary {
      font-size: 12px;
      color: var(--text-3);
      font-weight: 500;
    }

    .search-summary strong {
      color: var(--text-2);
      font-weight: 600;
    }

    /* Search result card — same as bookmark-card but with a path row */
    .search-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      text-decoration: none;
      color: var(--text-1);
      transition: background 0.15s, border-color 0.15s, transform 0.15s, box-shadow 0.15s;
      animation: cardIn 0.2s ease both;
      overflow: hidden;
      min-width: 0;
    }

    .search-card:hover {
      background: var(--surface-hover);
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: var(--shadow-glow);
    }

    .search-card-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
      min-width: 0;
    }

    .search-card-title {
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-1);
    }

    .search-card-path {
      font-size: 10px;
      color: var(--text-3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Highlight matched text */
    mark.hl {
      background: rgba(99,102,241,0.35);
      color: #c7d2fe;
      border-radius: 3px;
      padding: 0 1px;
      font-style: normal;
    }

    /* No results */
    .no-results {
      text-align: center;
      padding: 60px 24px;
      color: var(--text-3);
    }

    .no-results.hidden { display: none; }

    .no-results-icon {
      font-size: 40px;
      margin-bottom: 14px;
      display: block;
    }

    .no-results h3 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-2);
      margin-bottom: 6px;
    }

    .no-results p { font-size: 12px; }

    /* ═══════════════════════════════════════════════════════════════
       RESPONSIVE
    ═══════════════════════════════════════════════════════════════ */
    @media (max-width: 700px) {
      .header-inner { padding: 0 16px; gap: 10px; }
      .main, .search-panel { padding: 16px 16px 48px; }
      .bookmarks-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
      .search-kbd { display: none; }
    }

    @media (max-width: 420px) {
      .bookmarks-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

  <!-- ── HEADER ─────────────────────────────────────────── -->
  <header class="header" role="banner">
    <div class="header-inner">
      <h1 class="logo">
        <span class="logo-icon">⚡</span>
        Bookmarks
      </h1>

      <!-- ── Search bar ── -->
      <div class="search-wrap" role="search">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input
          type="search"
          id="search-input"
          class="search-input"
          placeholder="Search bookmarks…"
          autocomplete="off"
          spellcheck="false"
          aria-label="Search bookmarks"
        />
        <kbd class="search-kbd" aria-hidden="true">Ctrl K</kbd>
      </div>

      <div class="header-meta">
        <span class="badge" id="total-badge">Loading…</span>
      </div>
    </div>
  </header>

  <!-- ── SEARCH RESULTS PANEL (shown when typing) ─────── -->
  <div class="search-panel hidden" id="search-panel" role="region" aria-label="Search results" aria-live="polite">
    <p class="search-summary" id="search-summary"></p>
    <div class="bookmarks-grid" id="search-grid"></div>
    <div class="no-results hidden" id="no-results">
      <span class="no-results-icon">🔍</span>
      <h3>No results found</h3>
      <p>Try a different title or URL.</p>
    </div>
  </div>

  <!-- ── MAIN CATEGORIES ───────────────────────────────── -->
  <main class="main" id="main" role="main">
    <!-- Rendered by newtab.js -->
  </main>

  <script src="newtab.js"></script>
</body>
</html>
